name: Build and Push Docker

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: mvn clean package
        working-directory: .

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/images-service:latest .
        working-directory: .

      - name: Push Docker
        run: docker push ${{ secrets.DOCKER_USERNAME }}/images-service:latest