name: Users Service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'users-service/**'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'users-service/**'

env:
  IMAGE_NAME: users-service
  CONTAINER_APP_NAME: users-service
  RESOURCE_GROUP: techcup-rg

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: users-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Run tests
        run: mvn clean test

      - name: Build project
        run: mvn clean package -DskipTests

  docker-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: users-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/users-service:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/users-service:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name users-service \
            --resource-group techcup-rg \
            --image ${{ secrets.DOCKER_USERNAME }}/users-service:latest