sonar.projectKey=userService
sonar.projectName=userService
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# Solo código de producción (NO usar sonar.sources=/usr/src en Docker)
sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Cobertura JaCoCo (generar antes con: mvn clean verify)
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Interfaces Spring Data sin lógica ejecutable
sonar.coverage.exclusions=**/repository/**
